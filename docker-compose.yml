services:
  db:
    image: postgres:17
    container_name: catapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: catapp
      POSTGRES_PASSWORD: catapp
      POSTGRES_DB: catapp
    ports:
      - "5433:5432"
    volumes:
      - catapp-pgdata:/var/lib/postgresql/data

volumes:
  catapp-pgdata:
