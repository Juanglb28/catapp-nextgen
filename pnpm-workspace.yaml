onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
  - unrs-resolver
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  vite: ">=8.1.6 <9"
  # sharp/postcss: versiones forzadas porque Next.js y otras dependencias aún
  # traen versiones con vulnerabilidades altas ya parchadas río arriba
  # (libheif/librsvg en sharp <0.35.5; lectura arbitraria de archivos /
  # path traversal en postcss <=8.5.17).
  sharp: ">=0.35.5 <0.36.0"
  postcss: ">=8.5.18 <9"
  # Parches de auditoría (2026-11): transitivas de build, dev y Sentry/Serwist.
  undici: ">=7.30.1 <8"
  fast-uri: ">=3.1.7 <4"
  js-yaml: ">=4.3.2 <5"
  nanoid: ">=3.3.18 <4"
  source-map-js: ">=1.2.2 <2"
  browserslist: ">=4.28.7 <5"
  tinypool: ">=2.1.2 <3"
  zod: ">=4.6.6 <5"
  # brace-expansion: override por ruta y por major. Un override global a 5.x
  # rompe @eslint/eslintrc (minimatch@3 necesita la API 1.x).
  "minimatch@3>brace-expansion": ">=1.1.20 <2"
  "minimatch@8>brace-expansion": ">=2.1.6 <3"
  "minimatch@9>brace-expansion": ">=2.1.6 <3"
  "minimatch@10>brace-expansion": ">=5.0.13 <6"
