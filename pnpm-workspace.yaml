onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
  - unrs-resolver
allowBuilds:
  "@sentry/cli": true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  vite: ">=6.4.3"
  # sharp/postcss: Next.js 15.5.22 sigue trayendo internamente versiones con
  # vulnerabilidades altas ya parchadas río arriba (libvips en sharp <0.35.0;
  # lectura arbitraria de archivos / path traversal en postcss <=8.5.17).
  # Forzadas aquí porque Next.js aún no bumpeó sus propias dependencias.
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"

# GHSA-mh99-v99m-4gvg (brace-expansion DoS, 2026-07-29): la única vía real
# hacia producción es @sentry/nextjs > @sentry/node > minimatch@3 > brace-expansion.
# Forzar brace-expansion a la versión parchada (>=5.0.8) ROMPE @eslint/config-array
# (usa minimatch@3.1.5, que depende de la API vieja de brace-expansion@1.x;
# TypeError: expand is not a function). Riesgo real bajo: minimatch/brace-expansion
# en el SDK de Sentry solo hace pattern-matching interno de config
# (ignoreErrors/denyUrls), no procesa input de usuario. Revisar cuando
# @eslint/config-array o better-auth>next>@sentry/node bumpeen su propio minimatch.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
